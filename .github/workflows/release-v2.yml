name: release-v2

on:
  push:
    tags:
      - "v2-*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Validate tag and package version
        run: |
          node -e '
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME || "";
          const version = JSON.parse(fs.readFileSync("packages/v2/package.json", "utf8")).version;
          if (tag !== `v2-${version}`) {
            throw new Error(`tag/version mismatch: tag=${tag} package=${version}`);
          }
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository
        run: npm run lint && npm run typecheck && npm test

      - name: Build and pack V2
        run: npm --prefix ../.. run build:v2 && npm pack --dry-run
        working-directory: packages/v2

      - name: Test packed package in OpenCode 2
        run: npm run test:v2:e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish V2 beta
        run: npm publish --access public --provenance --tag next
        working-directory: packages/v2
